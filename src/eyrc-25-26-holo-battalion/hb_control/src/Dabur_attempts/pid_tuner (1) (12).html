<!DOCTYPE html>
<html>

<head>
    <title>Multi-Robot PID Tuner</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script>

    <style>
        .custom-range {
            width: 100%;
        }

        .axis-col {
            border-right: 1px solid #ddd;
        }

        .axis-col:last-child {
            border-right: none;
        }

        .nav-tabs .nav-link.active {
            background-color: #e9ecef;
            font-weight: bold;
        }

        .control-row {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }

        .slider-container {
            flex-grow: 1;
            padding-right: 10px;
        }

        .input-container {
            width: 85px;
        }
    </style>
</head>

<body class="bg-light">

    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-md-12">
                <h2 class="text-center mb-4">Multi-Robot PID Tuner</h2>
                <div id="status" class="alert alert-secondary text-center">Connecting to ROS...</div>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-header">
                        <ul class="nav nav-tabs card-header-tabs" id="botTabs" role="tablist"></ul>
                    </div>
                    <div class="card-body">
                        <div class="tab-content" id="botTabContent"></div>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card shadow-sm h-100">
                    <div class="card-header">Real-time Error Graph</div>
                    <div class="card-body">
                        <div style="height: 300px; width: 100%;">
                            <canvas id="errorChart"></canvas>
                        </div>
                        <div class="mt-2 text-muted small text-center">
                            Graphing Error (Target - Current)
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const NODE_NAME = '/holonomic_pid_tuner';
        const WS_URL = 'ws://localhost:9090';

        const BOTS = [0, 2, 4];
        const AXES = ['x', 'y', 'theta'];
        const TUNING_PARAMS = [
            { name: 'kp', min: -80, max: 80, step: 0.1, default: 1.5 },
            { name: 'ki', min: -80, max: 80, step: 0.001, default: 0.0 },
            { name: 'kd', min: -80, max: 80, step: 0.01, default: 0.01 }
        ];

        // --- 1. GENERATE UI ---
        function initUI() {
            const tabList = document.getElementById('botTabs');
            const tabContent = document.getElementById('botTabContent');

            BOTS.forEach((botId, index) => {
                const isActive = index === 0 ? 'active' : '';
                const isShow = index === 0 ? 'show active' : '';

                // Tab Header
                tabList.innerHTML += `
                        <li class="nav-item">
                            <a class="nav-link ${isActive}" id="tab-bot-${botId}" data-toggle="tab" href="#content-bot-${botId}" role="tab">
                                Robot ${botId}
                            </a>
                        </li>`;

                // Tab Content
                let axesHtml = '<div class="row">';
                AXES.forEach(axis => {
                    let axisLabel = axis === 'theta' ? 'THETA (Yaw)' : axis.toUpperCase();
                    axesHtml += `
                            <div class="col-md-4 axis-col">
                                <h5 class="text-center text-primary mt-2">${axisLabel}</h5>
                                <hr>
                                ${generateSlidersForAxis(botId, axis)}
                            </div>`;
                });
                axesHtml += '</div>';

                tabContent.innerHTML += `
                        <div class="tab-pane fade ${isShow}" id="content-bot-${botId}" role="tabpanel">
                            ${axesHtml}
                        </div>`;
            });
        }

        function generateSlidersForAxis(botId, axis) {
            let html = '';
            TUNING_PARAMS.forEach(param => {
                const baseId = `bot${botId}_${axis}_${param.name}`;
                html += `
                        <div class="form-group mb-2">
                            <label class="font-weight-bold small mb-0">${param.name.toUpperCase()}</label>
                            <div class="control-row">
                                <div class="slider-container">
                                    <input type="range" class="custom-range" id="${baseId}_slider"
                                        min="${param.min}" max="${param.max}" step="${param.step}" value="${param.default}"
                                        oninput="syncValues('${baseId}', this.value, 'slider')"
                                        onchange="updateParam(${botId}, '${axis}', '${param.name}', this.value)">
                                </div>
                                <div class="input-container">
                                    <input type="number" class="form-control form-control-sm" id="${baseId}_box"
                                        min="${param.min}" step="${param.step}" value="${param.default}"
                                        oninput="syncValues('${baseId}', this.value, 'box')"
                                        onchange="updateParam(${botId}, '${axis}', '${param.name}', this.value)">
                                </div>
                            </div>
                        </div>`;
            });
            return html;
        }

        function syncValues(baseId, value, source) {
            if (source === 'slider') {
                const box = document.getElementById(baseId + '_box');
                if (box) box.value = value;
            } else {
                const slider = document.getElementById(baseId + '_slider');
                if (slider) slider.value = value;
            }
        }

        initUI();

        // --- 2. ROS CONNECTION ---
        var ros = new ROSLIB.Ros({ url: WS_URL });

        ros.on('connection', function () {
            document.getElementById("status").innerHTML = "<strong>Connected</strong> to ROS Bridge";
            document.getElementById("status").className = "alert alert-success text-center";
        });

        ros.on('error', function (error) {
            document.getElementById("status").innerHTML = "<strong>Error:</strong> Check rosbridge_server";
            document.getElementById("status").className = "alert alert-danger text-center";
        });

        // --- 3. PARAMETER SERVICE (FIXED) ---
        var paramClient = new ROSLIB.Service({
            ros: ros,
            name: NODE_NAME + '/set_parameters',
            serviceType: 'rcl_interfaces/srv/SetParameters'
        });

        function updateParam(botId, axis, type, value) {
            var paramName = `bot${botId}_${axis}_${type}`;
            var floatVal = parseFloat(value); // Ensure it's a number

            // Construct the Parameter Object correctly for ROS 2
            // Type 3 = DOUBLE (Float64)
            var parameterMsg = {
                name: paramName,
                value: {
                    type: 3,
                    double_value: floatVal
                }
            };

            var request = new ROSLIB.ServiceRequest({
                parameters: [parameterMsg]
            });

            console.log(`Sending update for ${paramName}: ${floatVal}`); // Debug Log

            paramClient.callService(request, function (result) {
                // Check if the service call itself succeeded
                if (result) {
                    // Check the internal result for the parameter set
                    if (result.results && result.results.length > 0 && result.results[0].successful) {
                        console.log(`[SUCCESS] ${paramName} updated to ${floatVal}`);
                    } else {
                        console.error(`[FAIL] ${paramName} update rejected. Reason: ${result.results[0].reason}`);
                    }
                } else {
                    console.error(`[ERROR] Service call returned null for ${paramName}`);
                }
            });
        }

        // --- 4. CHART SETUP ---
        var ctx = document.getElementById('errorChart').getContext('2d');
        var chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    { label: 'Bot 0', borderColor: 'rgb(255, 99, 132)', backgroundColor: 'rgba(255, 99, 132, 0.2)', borderWidth: 2, pointRadius: 0, data: [] },
                    { label: 'Bot 2', borderColor: 'rgb(54, 162, 235)', backgroundColor: 'rgba(54, 162, 235, 0.2)', borderWidth: 2, pointRadius: 0, data: [] },
                    { label: 'Bot 4', borderColor: 'rgb(75, 192, 192)', backgroundColor: 'rgba(75, 192, 192, 0.2)', borderWidth: 2, pointRadius: 0, data: [] }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                interaction: { mode: 'index', intersect: false },
                scales: {
                    x: { display: false },
                    y: { suggestedMin: -50, suggestedMax: 50 }
                }
            }
        });

        // --- 5. GRAPH DATA LISTENER ---
        var listener = new ROSLIB.Topic({
            ros: ros,
            name: '/pid_graph_data',
            messageType: 'std_msgs/String'
        });

        listener.subscribe(function (message) {
            try {
                var data = JSON.parse(message.data);

                var botId = (data.bot_id !== undefined) ? data.bot_id : 0;

                var datasetIndex = -1;
                if (botId === 0) datasetIndex = 0;
                else if (botId === 2) datasetIndex = 1;
                else if (botId === 4) datasetIndex = 2;

                if (datasetIndex === -1) return;

                var timeLabel = new Date().toLocaleTimeString();
                var val = (data.error_x !== undefined) ? data.error_x : 0;

                // Simple sync: If new label needed, push it
                if (chart.data.labels.length === 0 || chart.data.labels[chart.data.labels.length - 1] !== timeLabel) {
                    chart.data.labels.push(timeLabel);
                    // Ensure all datasets have same length
                    chart.data.datasets.forEach(ds => {
                        while (ds.data.length < chart.data.labels.length - 1) {
                            ds.data.push(null);
                        }
                    });
                }

                chart.data.datasets[datasetIndex].data.push(val);

                if (chart.data.labels.length > 100) {
                    chart.data.labels.shift();
                    chart.data.datasets.forEach(ds => ds.data.shift());
                }

                chart.update();
            } catch (e) {
                console.warn("Graph parse error:", e);
            }
        });
    </script>
</body>

</html>
